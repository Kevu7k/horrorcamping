<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floresta – protótipo</title>
<style>
:root{--bg:#05070b;--fg:#d8dde6}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:Georgia,serif}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--fg);background:rgba(0,0,0,.6);text-align:center;cursor:pointer;padding:16px;box-sizing:border-box}
#msg b{font-size:26px;font-weight:normal;letter-spacing:.04em}
#msg small{opacity:.7;margin-top:10px;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"><b>Clique para entrar na floresta</b><small>W A S D para andar · Shift corre<br>mouse para olhar (ou arraste) · setas também olham · Esc pausa</small></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas = document.getElementById('c'), msg = document.getElementById('msg');
const SCALE = 2; // quanto maior, mais pixelado (visual PS2)
const FOG = 0x0a0f1a;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(1);
const scene = new THREE.Scene();
scene.background = new THREE.Color(FOG);
scene.fog = new THREE.Fog(FOG, 4, 38);
const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 120);
camera.rotation.order = 'YXZ';

function resize() {
  renderer.setSize(Math.ceil(innerWidth / SCALE), Math.ceil(innerHeight / SCALE), false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// Textura pixelada gerada por código (sem arquivos externos)
function tex(base, noise, rep) {
  const s = 32, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
    const v = (Math.random() - 0.5) * noise;
    g.fillStyle = `rgb(${base[0] + v | 0},${base[1] + v | 0},${base[2] + v | 0})`;
    g.fillRect(x, y, 1, 1);
  }
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep);
  return t;
}
const mat = (base, noise, rep = 1) => new THREE.MeshLambertMaterial({ map: tex(base, noise, rep) });

// Luzes
scene.add(new THREE.AmbientLight(0x2a3a55, 0.55));
const moon = new THREE.DirectionalLight(0x7088b0, 0.4); moon.position.set(-30, 50, -40); scene.add(moon);
const fireLight = new THREE.PointLight(0xff8a3a, 1.6, 16, 2); fireLight.position.set(0, 1.1, 0); scene.add(fireLight);

// Chão
const ground = new THREE.Mesh(new THREE.PlaneGeometry(220, 220), mat([72, 56, 40], 34, 70));
ground.rotation.x = -Math.PI / 2; scene.add(ground);

// Árvores low-poly
const trunkG = new THREE.CylinderGeometry(0.25, 0.38, 3.2, 5), leafG = new THREE.ConeGeometry(1.7, 3.6, 6);
const trunkM = mat([60, 42, 30], 30), leafM = mat([22, 52, 34], 26);
for (let i = 0; i < 150; i++) {
  const a = Math.random() * Math.PI * 2, r = 9 + Math.random() * 62;
  const x = Math.cos(a) * r, z = Math.sin(a) * r, k = 0.8 + Math.random() * 0.9;
  const tree = new THREE.Group();
  const tr = new THREE.Mesh(trunkG, trunkM); tr.position.y = 1.6; tree.add(tr);
  const l1 = new THREE.Mesh(leafG, leafM); l1.position.y = 4; tree.add(l1);
  const l2 = new THREE.Mesh(leafG, leafM); l2.position.y = 5.7; l2.scale.setScalar(0.7); tree.add(l2);
  tree.position.set(x, 0, z); tree.scale.setScalar(k); tree.rotation.y = Math.random() * 6; scene.add(tree);
}

// Barraca
const tent = new THREE.Mesh(new THREE.ConeGeometry(2.3, 2.1, 4), mat([140, 110, 62], 24));
tent.position.set(-4.2, 1.05, -3); tent.rotation.y = Math.PI / 4 + 0.3; tent.scale.z = 1.5; scene.add(tent);

// Fogueira: pedras, lenha e chamas
const stoneM = mat([90, 90, 94], 40), stoneG = new THREE.BoxGeometry(0.34, 0.24, 0.34);
for (let i = 0; i < 9; i++) {
  const a = i / 9 * Math.PI * 2, s = new THREE.Mesh(stoneG, stoneM);
  s.position.set(Math.cos(a) * 0.8, 0.12, Math.sin(a) * 0.8); s.rotation.y = a * 3; scene.add(s);
}
const logG = new THREE.CylinderGeometry(0.09, 0.09, 1.1, 5), logM = mat([70, 46, 30], 24);
for (let i = 0; i < 3; i++) {
  const lg = new THREE.Mesh(logG, logM); lg.rotation.z = Math.PI / 2; lg.rotation.y = i * 1.05;
  lg.position.y = 0.2; scene.add(lg);
}
const flame = new THREE.Mesh(new THREE.ConeGeometry(0.38, 1, 5), new THREE.MeshBasicMaterial({ color: 0xff8a2a, fog: false }));
flame.position.y = 0.65; scene.add(flame);
const core = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.6, 5), new THREE.MeshBasicMaterial({ color: 0xffd25a, fog: false }));
core.position.y = 0.5; scene.add(core);
// Troncos para sentar
for (const [x, z, r] of [[2.4, 0.4, 0.2], [0.6, 2.5, 1.5]]) {
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 1.8, 6), logM);
  b.rotation.z = Math.PI / 2; b.rotation.y = r; b.position.set(x, 0.28, z); scene.add(b);
}

// Lua e estrelas
const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(3, 8, 6), new THREE.MeshBasicMaterial({ color: 0xcfd8e8, fog: false }));
moonMesh.position.set(-45, 55, -80); scene.add(moonMesh);
const sp = [];
for (let i = 0; i < 260; i++) {
  const a = Math.random() * Math.PI * 2, e = 0.15 + Math.random() * 1.3, R = 100;
  sp.push(Math.cos(a) * Math.cos(e) * R, Math.sin(e) * R, Math.sin(a) * Math.cos(e) * R);
}
const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xdde6ff, size: 2, sizeAttenuation: false, fog: false })));

// Controles
const keys = {};
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup', e => keys[e.code] = false);
let yaw = Math.atan2(4, 6), pitch = 0, playing = false, locked = false, dragging = false;
const pos = { x: 4, z: 6 };
const clampPitch = p => Math.max(-1.4, Math.min(1.4, p));
function look(dx, dy) { yaw -= dx * 0.0022; pitch = clampPitch(pitch - dy * 0.0022); }

msg.addEventListener('click', () => {
  msg.style.display = 'none'; playing = true;
  try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
});
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === canvas;
  if (!locked && playing) { playing = false; msg.style.display = 'flex'; }
});
addEventListener('mousemove', e => { if (locked) look(e.movementX, e.movementY); else if (dragging && playing) look(e.movementX, e.movementY); });
canvas.addEventListener('mousedown', () => dragging = true);
addEventListener('mouseup', () => dragging = false);

// Loop
let last = performance.now(), t = 0, bob = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  if (playing) {
    yaw += ((keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0)) * 1.8 * dt;
    pitch = clampPitch(pitch + ((keys.ArrowUp ? 1 : 0) - (keys.ArrowDown ? 1 : 0)) * 1.2 * dt);
    const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    if (f || s) {
      const speed = keys.ShiftLeft ? 6 : 3.2, n = Math.hypot(f, s);
      pos.x += (-Math.sin(yaw) * f + Math.cos(yaw) * s) / n * speed * dt;
      pos.z += (-Math.cos(yaw) * f - Math.sin(yaw) * s) / n * speed * dt;
      bob += dt * speed * 2.2;
    }
    const d = Math.hypot(pos.x, pos.z);
    if (d > 75) { pos.x *= 75 / d; pos.z *= 75 / d; }           // limite do mapa
    if (d < 1.3) { pos.x *= 1.3 / (d || 1); pos.z *= 1.3 / (d || 1); } // não entra na fogueira
  }
  camera.position.set(pos.x, 1.7 + Math.sin(bob) * 0.04, pos.z);
  camera.rotation.set(pitch, yaw, 0);
  fireLight.intensity = 1.5 + Math.sin(t * 21) * 0.2 + Math.random() * 0.3;
  flame.scale.set(1, 1 + Math.sin(t * 14) * 0.15 + Math.random() * 0.1, 1);
  core.scale.y = 1 + Math.sin(t * 18) * 0.2;
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
