<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floresta – protótipo</title>
<style>
:root{--bg:#05070b;--fg:#d8dde6}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:Georgia,serif}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--fg);background:rgba(0,0,0,.6);text-align:center;cursor:pointer;padding:16px;box-sizing:border-box}
#msg b{font-size:26px;font-weight:normal;letter-spacing:.04em}
#msg small{opacity:.75;margin-top:10px;font-size:14px;line-height:1.6}
#hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;color:#f2eee2;background:rgba(0,0,0,.45);padding:8px 12px;font-size:14px;line-height:1.5;border-radius:4px;pointer-events:none}
#bar{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;width:140px;height:10px;background:rgba(0,0,0,.5);border-radius:5px;overflow:hidden;pointer-events:none}
#bar i{display:block;height:100%;width:100%;background:#f0b44a}
#hint{position:fixed;bottom:12%;left:0;right:0;text-align:center;color:#fff;font-size:18px;text-shadow:0 1px 3px #000;pointer-events:none}
#toast{position:fixed;top:22%;left:0;right:0;text-align:center;color:#fff;font-size:20px;text-shadow:0 1px 4px #000;opacity:0;transition:opacity .6s;pointer-events:none;padding:0 16px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div><div id="bar"><i></i></div><div id="hint"></div><div id="toast"></div>
<div id="msg"><b>Clique para entrar na floresta</b><small>W A S D andar · Shift corre · F lanterna · E interagir<br>mouse para olhar (ou arraste) · setas também olham · Esc pausa<br>Siga a trilha, ache um lugar para acampar e monte tudo antes de anoitecer</small></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas = document.getElementById('c'), msg = document.getElementById('msg');
const SCALE = 1; // quanto maior, mais pixelado (visual PS2)
const DAY_LEN = 90; // segundos até anoitecer de vez
const rnd = Math.random;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(1);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fb8e0);
scene.fog = new THREE.Fog(0x8fb8e0, 10, 80);
const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 120);
camera.rotation.order = 'YXZ';
function resize() {
  renderer.setSize(Math.ceil(innerWidth / SCALE), Math.ceil(innerHeight / SCALE), false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// Textura pixelada gerada por código
function tex(base, noise, rep) {
  const s = 32, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
    const v = (rnd() - 0.5) * noise;
    g.fillStyle = `rgb(${base[0] + v | 0},${base[1] + v | 0},${base[2] + v | 0})`; g.fillRect(x, y, 1, 1);
  }
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep);
  return t;
}
// Phong sem brilho: luz por pixel (a lanterna precisa disso no chão)
const mat = (base, noise, rep = 1) => new THREE.MeshPhongMaterial({ map: tex(base, noise, rep), specular: 0x000000, shininess: 0 });

// Luzes
const ambient = new THREE.AmbientLight(0x2a3a55, 0.8); scene.add(ambient);
const moon = new THREE.DirectionalLight(0xfff0d0, 0.9); moon.position.set(-30, 50, -40); scene.add(moon);
const torch = new THREE.SpotLight(0xfff0c8, 2.4, 32, Math.PI / 7, 0.5, 1.4);
torch.position.set(0.25, -0.2, 0); torch.target.position.set(0, 0, -6);
camera.add(torch, torch.target); scene.add(camera);

// ---------- Mundo: trilha, clareira e árvores (muda a cada partida) ----------
const p1 = rnd() * 6.28, p2 = rnd() * 6.28;
const fx = s => 9 * Math.sin(s * 0.045 + p1) + 5 * Math.sin(s * 0.11 + p2) - (9 * Math.sin(p1) + 5 * Math.sin(p2));
const TX = [], TZ = [], vp = [], vu = [], vi = [];
for (let s = -6, i = 0; s <= 130; s += 2, i++) {
  const x = fx(s), z = -s, dx = fx(s + 2) - x, l = Math.hypot(2, dx), nx = 2 / l, nz = dx / l;
  TX.push(x); TZ.push(z);
  vp.push(x - nx * 1.3, 0.045, z - nz * 1.3, x + nx * 1.3, 0.045, z + nz * 1.3); vu.push(0, i * 0.5, 1, i * 0.5);
  if (i) { const a = (i - 1) * 2; vi.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
}
const trailG = new THREE.BufferGeometry();
trailG.setAttribute('position', new THREE.Float32BufferAttribute(vp, 3)); trailG.setAttribute('uv', new THREE.Float32BufferAttribute(vu, 2));
trailG.setIndex(vi); trailG.computeVertexNormals();
const trailM = mat([112, 90, 62], 26); trailM.side = THREE.DoubleSide; scene.add(new THREE.Mesh(trailG, trailM));
const trailDist = (x, z) => { let d = 1e9; for (let i = 0; i < TX.length; i++) d = Math.min(d, Math.hypot(x - TX[i], z - TZ[i])); return d; };

const ground = new THREE.Mesh(new THREE.PlaneGeometry(320, 320), mat([72, 56, 40], 34, 80));
ground.rotation.x = -Math.PI / 2; ground.position.z = -65; scene.add(ground);

// Local do acampamento: ao lado da trilha, em distância e lado sorteados
const sIdx = 22 + Math.floor(rnd() * 22), side = rnd() < 0.5 ? -1 : 1;
const CAMP = { x: TX[sIdx] + side * 7.5, z: TZ[sIdx] };
const clearing = new THREE.Mesh(new THREE.CircleGeometry(8, 16), mat([96, 80, 56], 30, 4));
clearing.rotation.x = -Math.PI / 2; clearing.position.set(CAMP.x, 0.03, CAMP.z); scene.add(clearing);

// Árvores (InstancedMesh = leve) + colisão
const solid = []; // círculos sólidos: { x, z, r }
const N = 430, dummy = new THREE.Object3D();
const trunkG = new THREE.CylinderGeometry(0.25, 0.38, 3.2, 5), leafG = new THREE.ConeGeometry(1.7, 3.6, 6);
const tT = new THREE.InstancedMesh(trunkG, mat([60, 42, 30], 30), N), tL1 = new THREE.InstancedMesh(leafG, mat([22, 52, 34], 26), N), tL2 = new THREE.InstancedMesh(leafG, tL1.material, N);
const put = (m, i, x, y, z, k, r) => { dummy.position.set(x, y, z); dummy.scale.setScalar(k); dummy.rotation.y = r; dummy.updateMatrix(); m.setMatrixAt(i, dummy.matrix); };
let n = 0;
for (let tries = 0; n < N && tries < 6000; tries++) {
  const x = (rnd() - 0.5) * 140, z = 20 - rnd() * 170;
  if (Math.hypot(x, z) < 5 || Math.hypot(x - CAMP.x, z - CAMP.z) < 9.5 || trailDist(x, z) < 3.2) continue;
  const k = 0.8 + rnd() * 0.9, r = rnd() * 6;
  put(tT, n, x, 1.6 * k, z, k, r); put(tL1, n, x, 4 * k, z, k, r); put(tL2, n, x, 5.7 * k, z, 0.7 * k, r);
  solid.push({ x, z, r: 0.4 * k }); n++;
}
for (const m of [tT, tL1, tL2]) { m.count = n; m.frustumCulled = false; m.instanceMatrix.needsUpdate = true; scene.add(m); }

// ---------- Acampamento (coordenadas locais; o grupo fica na clareira) ----------
const camp = new THREE.Group(); camp.position.set(CAMP.x, 0, CAMP.z); scene.add(camp);
solid.push({ x: CAMP.x, z: CAMP.z, r: 1.1 }); // fogueira

const stoneM = mat([90, 90, 94], 40), stoneG = new THREE.BoxGeometry(0.34, 0.24, 0.34);
for (let i = 0; i < 9; i++) {
  const a = i / 9 * Math.PI * 2, s = new THREE.Mesh(stoneG, stoneM);
  s.position.set(Math.cos(a) * 0.8, 0.12, Math.sin(a) * 0.8); s.rotation.y = a * 3; camp.add(s);
}
const logG = new THREE.CylinderGeometry(0.09, 0.09, 1.1, 5), logM = mat([70, 46, 30], 24), fireLogs = [];
for (let i = 0; i < 3; i++) {
  const lg = new THREE.Mesh(logG, logM); lg.rotation.z = Math.PI / 2; lg.rotation.y = i * 1.05;
  lg.position.y = 0.2; lg.visible = false; fireLogs.push(lg); camp.add(lg);
}
const flame = new THREE.Mesh(new THREE.ConeGeometry(0.38, 1, 5), new THREE.MeshBasicMaterial({ color: 0xff8a2a, fog: false }));
flame.position.y = 0.65; flame.visible = false; camp.add(flame);
const core = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.6, 5), new THREE.MeshBasicMaterial({ color: 0xffd25a, fog: false }));
core.position.y = 0.5; core.visible = false; camp.add(core);
const fireLight = new THREE.PointLight(0xff8a3a, 0, 16, 2); fireLight.position.set(0, 1.1, 0); camp.add(fireLight);
for (const [x, z, r] of [[2.4, 0.4, 0.2], [0.6, 2.5, 1.5]]) {
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 1.8, 6), logM);
  b.rotation.z = Math.PI / 2; b.rotation.y = r; b.position.set(x, 0.28, z); camp.add(b);
}

// Mochila (aparece quando você decide acampar)
const BAG = { x: 2.4, z: 2.8 };
const backpack = new THREE.Group();
const bagBody = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.75, 0.32), mat([150, 60, 40], 30)); bagBody.position.y = 0.38; backpack.add(bagBody);
const bagPocket = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.14), mat([110, 45, 30], 30)); bagPocket.position.set(0, 0.25, 0.23); backpack.add(bagPocket);
backpack.position.set(BAG.x, 0, BAG.z); backpack.rotation.y = 0.6; backpack.visible = false; camp.add(backpack);

// Lona no chão e barraca entrável
const TENT = { x: -5, z: -3, w: 2.4, l: 3, h: 2.1, rot: Math.atan2(5, 3) };
const tarp = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 4.2).rotateX(-Math.PI / 2), mat([70, 100, 120], 22));
tarp.position.set(TENT.x, 0.06, TENT.z); tarp.rotation.y = TENT.rot; tarp.visible = false; camp.add(tarp);
const tent = new THREE.Group(), tentM = mat([140, 110, 62], 24); tentM.side = THREE.DoubleSide;
const hw = TENT.w / 2, hl = TENT.l / 2, dh = TENT.h * (1 - 0.5 / hw), slope = Math.hypot(hw, TENT.h), ang = Math.atan2(TENT.h, hw);
for (const s of [-1, 1]) {
  const p = new THREE.Mesh(new THREE.PlaneGeometry(slope, TENT.l).rotateX(-Math.PI / 2), tentM);
  p.rotation.z = -s * ang; p.position.set(s * hw / 2, TENT.h / 2, 0); tent.add(p);
}
function tri(pts, z) {
  const sh = new THREE.Shape(); sh.moveTo(...pts[0]); sh.lineTo(...pts[1]); sh.lineTo(...pts[2]);
  const m = new THREE.Mesh(new THREE.ShapeGeometry(sh), tentM); m.position.z = z; tent.add(m);
}
tri([[-hw, 0], [hw, 0], [0, TENT.h]], -hl);
tri([[-hw, 0], [-0.5, 0], [-0.5, dh]], hl);
tri([[hw, 0], [0.5, 0], [0.5, dh]], hl);
const sbag = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.14, 1.7), mat([40, 60, 110], 24)); sbag.position.set(0.3, 0.12, -0.3); tent.add(sbag);
tent.position.set(TENT.x, 0, TENT.z); tent.rotation.y = TENT.rot; tent.scale.setScalar(0.01); tent.visible = false; camp.add(tent);
const spot = new THREE.Mesh(new THREE.RingGeometry(1.7, 1.9, 24).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xe8d9a0, fog: false }));
spot.position.set(TENT.x, 0.07, TENT.z); spot.visible = false; camp.add(spot);

// Céu: lua e estrelas acompanham a câmera
const sky = new THREE.Group(); scene.add(sky);
const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(3, 8, 6), new THREE.MeshBasicMaterial({ color: 0xcfd8e8, fog: false }));
moonMesh.position.set(-45, 55, -80); sky.add(moonMesh);
const sp = [];
for (let i = 0; i < 260; i++) {
  const a = rnd() * 6.283, e = 0.15 + rnd() * 1.3, R = 100;
  sp.push(Math.cos(a) * Math.cos(e) * R, Math.sin(e) * R, Math.sin(a) * Math.cos(e) * R);
}
const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
const starM = new THREE.PointsMaterial({ color: 0xdde6ff, size: 2, sizeAttenuation: false, fog: false, transparent: true });
sky.add(new THREE.Points(sg, starM));

// ---------- Itens: sujeira da clareira (6) e lenha na mata (3) ----------
const items = [];
function addItem(kind, geo, color, x, z, lying) {
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color }));
  m.position.set(x, 0.12, z); m.rotation.set(0, rnd() * 6, lying ? Math.PI / 2 : 0); scene.add(m); items.push({ kind, m, taken: false });
}
const galhoG = new THREE.CylinderGeometry(0.05, 0.05, 1, 5), pedraG = new THREE.DodecahedronGeometry(0.2), folhaG = new THREE.BoxGeometry(0.6, 0.04, 0.45), lenhaG = new THREE.CylinderGeometry(0.1, 0.1, 0.9, 5);
for (const [g, c, ly] of [[galhoG, 0x7a5a38, 1], [galhoG, 0x6b4e30, 1], [pedraG, 0x8a8a90, 0], [pedraG, 0x77777e, 0], [folhaG, 0x6f6a2e, 0], [folhaG, 0x8a5a2a, 0]]) {
  for (let k = 0; k < 40; k++) {
    const a = rnd() * 6.283, r = 2.5 + rnd() * 4.5, lx = Math.cos(a) * r, lz = Math.sin(a) * r;
    if (Math.hypot(lx - TENT.x, lz - TENT.z) < 3 || Math.hypot(lx - BAG.x, lz - BAG.z) < 1.2) continue;
    addItem('trash', g, c, CAMP.x + lx, CAMP.z + lz, ly); break;
  }
}
for (let i = 0; i < 3; i++) { const a = rnd() * 6.283, r = 10 + rnd() * 8; addItem('wood', lenhaG, 0xa0703c, CAMP.x + Math.cos(a) * r, CAMP.z + Math.sin(a) * r, 1); }

// ---------- Estado do jogo ----------
const hud = document.getElementById('hud'), bar = document.querySelector('#bar i'), hint = document.getElementById('hint'), toastEl = document.getElementById('toast');
let ph = 0, clean = 0, wood = 0, stacked = false, fireLit = false, tentBuilt = false, buildT = 0, gt = 0, eyeH = 1.7, nightWarned = false;
function toast(s) { toastEl.textContent = s; toastEl.style.opacity = 1; clearTimeout(toast.h); toast.h = setTimeout(() => toastEl.style.opacity = 0, 4500); }
function updateHud() {
  const L = ['Achar um lugar para acampar', 'Abrir a mochila', `Limpar a área (${clean}/6)`, 'Estender a lona', 'Montar a barraca', `Armar a fogueira (lenha ${wood}/3)`];
  hud.innerHTML = L.map((s, i) => i < ph ? '✓ ' + s : i === ph ? '▶ <b>' + s + '</b>' : '· ' + s).join('<br>');
}
updateHud();

const C = h => new THREE.Color(h), dayC = C(0x8fb8e0), duskC = C(0xd9805a), nightC = C(0x0a0f1a), sunC = C(0xfff0d0), moonC = C(0x7088b0), tmp = new THREE.Color();
function applyDay(p) {
  if (p < 0.7) tmp.lerpColors(dayC, duskC, p / 0.7); else tmp.lerpColors(duskC, nightC, (p - 0.7) / 0.3);
  scene.background.copy(tmp); scene.fog.color.copy(tmp);
  scene.fog.near = 10 - 6 * p; scene.fog.far = 80 - 42 * p;
  ambient.intensity = 0.85 - 0.63 * p; moon.intensity = 0.9 - 0.68 * p; moon.color.lerpColors(sunC, moonC, p);
  starM.opacity = Math.max(0, (p - 0.8) * 5); moonMesh.visible = p > 0.75;
  bar.style.width = (100 - p * 100) + '%';
}

// ---------- Controles ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyF' && !e.repeat) torch.visible = !torch.visible;
  if (e.code === 'KeyE' && !e.repeat && playing) interact();
});
addEventListener('keyup', e => keys[e.code] = false);
let yaw = 0, pitch = 0, playing = false, locked = false, dragging = false;
const pos = { x: 0, z: 2 };
const clampPitch = p => Math.max(-1.4, Math.min(1.4, p));
function look(dx, dy) { yaw -= dx * 0.0022; pitch = clampPitch(pitch - dy * 0.0022); }
msg.addEventListener('click', () => {
  msg.style.display = 'none'; playing = true;
  try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
});
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === canvas;
  if (!locked && playing) { playing = false; msg.style.display = 'flex'; }
});
addEventListener('mousemove', e => { if (locked || (dragging && playing)) look(e.movementX, e.movementY); });
canvas.addEventListener('mousedown', () => dragging = true);
addEventListener('mouseup', () => dragging = false);

// ---------- Interação ----------
const near = (x, z, r) => Math.hypot(pos.x - x, pos.z - z) < r;
const nearL = (x, z, r) => near(CAMP.x + x, CAMP.z + z, r);
function target() {
  if (ph === 0) return nearL(0, 0, 7) ? { msg: 'E: acampar aqui', act: () => { ph = 1; backpack.visible = true; toast('Bom lugar para passar a noite. Abra a mochila.'); } } : null;
  for (const it of items) {
    if (it.taken || !near(it.m.position.x, it.m.position.z, 2) || (it.kind === 'wood' ? ph < 2 : ph !== 2)) continue;
    return { msg: it.kind === 'wood' ? 'E: pegar lenha' : 'E: limpar', act: () => { it.taken = true; it.m.visible = false; if (it.kind === 'wood') wood++; else if (++clean === 6) { ph = 3; toast('Área limpa. Agora a lona.'); } } };
  }
  if (ph === 1 && nearL(BAG.x, BAG.z, 2.4)) return { msg: 'E: abrir a mochila', act: () => { ph = 2; toast('Limpe a área: galhos, pedras e folhas. Junte lenha na mata.'); } };
  if (ph === 3 && nearL(TENT.x, TENT.z, 3.4)) return { msg: 'E: estender a lona', act: () => { ph = 4; tarp.visible = true; } };
  if (ph === 4 && nearL(TENT.x, TENT.z, 3.4)) return { msg: 'E: montar a barraca', act: () => { ph = 5; tentBuilt = true; tent.visible = true; } };
  if (ph === 5 && nearL(0, 0, 3)) {
    if (!stacked) return wood === 3 ? { msg: 'E: empilhar a lenha', act: () => { stacked = true; fireLogs.forEach(l => l.visible = true); } } : { msg: 'Faltam gravetos (' + wood + '/3)' };
    return { msg: 'E: acender a fogueira', act: () => { fireLit = true; ph = 6; flame.visible = core.visible = true; toast(gt < DAY_LEN ? 'Acampamento pronto antes da noite. Agora é esperar o que vem... 🔥' : 'Você conseguiu, mas a noite já chegou...'); } };
  }
  return null;
}
function interact() { const g = target(); if (g && g.act) { g.act(); updateHud(); } }

// Colisão: árvores, fogueira e paredes da barraca (a porta fica livre)
const cs = Math.cos(TENT.rot), sn = Math.sin(TENT.rot), TWX = CAMP.x + TENT.x, TWZ = CAMP.z + TENT.z;
const Wp = (x, z) => [TWX + x * cs + z * sn, TWZ - x * sn + z * cs];
const segs = [[-hw, -hl, -hw, hl], [hw, -hl, hw, hl], [-hw, -hl, hw, -hl], [-hw, hl, -0.5, hl], [0.5, hl, hw, hl], [-0.65, -hl, -0.65, hl], [0.65, -hl, 0.65, hl]].map(s => [...Wp(s[0], s[1]), ...Wp(s[2], s[3])]);
function push(cx, cz, rad) {
  const ex = pos.x - cx, ez = pos.z - cz, dd = Math.hypot(ex, ez);
  if (dd < rad && dd > 0.0001) { pos.x = cx + ex / dd * rad; pos.z = cz + ez / dd * rad; }
}
function collide() {
  for (const s of solid) if (Math.abs(pos.x - s.x) < 2 && Math.abs(pos.z - s.z) < 2) push(s.x, s.z, s.r + 0.35);
  if (!tentBuilt || buildT < 1) return;
  for (const [ax, az, bx, bz] of segs) {
    const dx = bx - ax, dz = bz - az, k = Math.max(0, Math.min(1, ((pos.x - ax) * dx + (pos.z - az) * dz) / (dx * dx + dz * dz)));
    push(ax + dx * k, az + dz * k, 0.35);
  }
}
function targetEye() { // dentro da barraca a câmera abaixa
  const dx = pos.x - TWX, dz = pos.z - TWZ, lx = dx * cs - dz * sn, lz = dx * sn + dz * cs;
  if (!tentBuilt || Math.abs(lx) > hw || Math.abs(lz) > hl) return 1.7;
  return Math.max(0.7, Math.min(1.15, TENT.h * (1 - Math.abs(lx) / hw) - 0.2));
}
function tick(dt) {
  const g = target(), txt = playing && g ? g.msg : '';
  if (hint.textContent !== txt) hint.textContent = txt;
  for (const it of items) if (!it.taken && it.kind === 'wood') it.m.position.y = 0.2 + Math.sin(t * 2 + it.m.position.x) * 0.06;
  spot.visible = ph === 3 || ph === 4;
  sky.position.set(camera.position.x, 0, camera.position.z);
  if (tentBuilt && buildT < 1) { buildT = Math.min(1, buildT + dt * 1.2); tent.scale.setScalar(0.01 + 0.99 * (1 - Math.pow(1 - buildT, 3))); }
  if (gt >= DAY_LEN && !nightWarned && ph < 6) { nightWarned = true; toast('A noite chegou e o acampamento ainda não está pronto...'); }
}

// ---------- Loop ----------
let last = performance.now(), t = 0, bob = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  if (playing) gt += dt;
  applyDay(Math.min(1, gt / DAY_LEN));
  if (playing) {
    yaw += ((keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0)) * 1.8 * dt;
    pitch = clampPitch(pitch + ((keys.ArrowUp ? 1 : 0) - (keys.ArrowDown ? 1 : 0)) * 1.2 * dt);
    const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    if (f || s) {
      const speed = keys.ShiftLeft ? 6 : 3.2, nn = Math.hypot(f, s);
      pos.x += (-Math.sin(yaw) * f + Math.cos(yaw) * s) / nn * speed * dt;
      pos.z += (-Math.cos(yaw) * f - Math.sin(yaw) * s) / nn * speed * dt;
      bob += dt * speed * 2.2;
    }
    pos.x = Math.max(-72, Math.min(72, pos.x)); pos.z = Math.max(-150, Math.min(18, pos.z));
    collide();
  }
  eyeH += (targetEye() - eyeH) * Math.min(1, dt * 6);
  camera.position.set(pos.x, eyeH + Math.sin(bob) * 0.04, pos.z);
  camera.rotation.set(pitch, yaw, 0);
  torch.position.set(0.25 + Math.sin(bob * 0.5) * 0.02, -0.2 + Math.sin(bob) * 0.015, 0);
  tick(dt);
  fireLight.intensity = fireLit ? 1.5 + Math.sin(t * 21) * 0.2 + rnd() * 0.3 : 0;
  flame.scale.set(1, 1 + Math.sin(t * 14) * 0.15 + rnd() * 0.1, 1);
  core.scale.y = 1 + Math.sin(t * 18) * 0.2;
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);
</script>
